{% extends "base.html" %}
{% block title %}Eliminar{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="glass p-4 text-center">
      <h3 class="text-danger">¿Eliminar registro?</h3>
      <p class="my-3">Se borrará <strong>{{ object }}</strong> de forma permanente.</p>
      <form method="post">
        {% csrf_token %}
        <button class="btn btn-danger">Sí, eliminar</button>
        <a href="{% url 'lista' %}" class="btn btn-outline-light">Cancelar</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
