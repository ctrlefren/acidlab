<!doctype html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AcidLab{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background: radial-gradient(900px 500px at 0 -10%, #0e7490, transparent 60%), #0b1220; min-height: 100vh; }
    .glass { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); border-radius: 1rem; }
  </style>
</head>
<body>
<nav class="navbar border-bottom border-secondary-subtle">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{% url 'lista' %}">
      <i class="bi bi-droplet-half text-info"></i> Acid<span class="text-info">Lab</span>
    </a>
    <div class="d-flex gap-2 align-items-center">
      {% if user.is_authenticated %}
        <span class="text-secondary d-none d-md-inline">{{ user.username }}</span>
        <a class="btn btn-info btn-sm" href="{% url 'crear' %}"><i class="bi bi-plus-lg"></i> Nueva medición</a>
        <form method="post" action="{% url 'logout' %}" class="m-0">
          {% csrf_token %}
          <button class="btn btn-outline-light btn-sm">Salir</button>
        </form>
      {% else %}
        <a class="btn btn-outline-light btn-sm" href="{% url 'login' %}">Iniciar sesión</a>
      {% endif %}
    </div>
  </div>
</nav>

<main class="container py-4">
  {% for message in messages %}
    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
      {{ message }}
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
